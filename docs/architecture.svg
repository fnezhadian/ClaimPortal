<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ClaimPortal Clean Architecture layers</title>
<desc>Diagram showing Controllers and DTOs at the outer layer, Services in the middle, and Data alongside, all depending inward on the core Models layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; fill: #5F5E5A; }
.box { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
.gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.coral { fill: #FAECE7; stroke: #D85A30; stroke-width: 0.5; }
.teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
</style>

<line x1="150" y1="96" x2="150" y2="160" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="240" y1="68" x2="430" y2="68" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M150 216 L150 250 L300 250 L300 280" fill="none" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M530 216 L530 250 L380 250 L380 280" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect class="gray" x="60" y="40" width="180" height="56" rx="8"/>
<text class="th" x="150" y="63" text-anchor="middle">Controllers</text>
<text class="ts" x="150" y="81" text-anchor="middle">HTTP endpoints</text>
</g>

<g>
<rect class="coral" x="430" y="40" width="200" height="56" rx="8"/>
<text class="th" x="530" y="63" text-anchor="middle">DTOs</text>
<text class="ts" x="530" y="81" text-anchor="middle">API request/response</text>
</g>

<g>
<rect class="teal" x="60" y="160" width="180" height="56" rx="8"/>
<text class="th" x="150" y="183" text-anchor="middle">Services</text>
<text class="ts" x="150" y="201" text-anchor="middle">Business logic</text>
</g>

<g>
<rect class="gray" x="430" y="160" width="200" height="56" rx="8"/>
<text class="th" x="530" y="183" text-anchor="middle">Data</text>
<text class="ts" x="530" y="201" text-anchor="middle">EF Core, DbContext</text>
</g>

<g>
<rect class="purple" x="250" y="280" width="180" height="56" rx="8"/>
<text class="th" x="340" y="303" text-anchor="middle">Models</text>
<text class="ts" x="340" y="321" text-anchor="middle">Domain entities (core)</text>
</g>

<text class="ts" x="340" y="360" text-anchor="middle">Arrows show dependency direction — Models depends on nothing else</text>
</svg>
