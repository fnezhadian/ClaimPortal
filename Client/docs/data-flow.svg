<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ClaimPortal client data flow</title>
<desc>Diagram showing the submit-to-refresh loop: ClaimForm submits, the API call fires, a callback notifies App, App refetches claims, and ClaimsList re-renders.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; fill: #5F5E5A; }
.purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
.teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.coral { fill: #FAECE7; stroke: #D85A30; stroke-width: 0.5; }
</style>

<line x1="340" y1="96" x2="340" y2="126" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="182" x2="340" y2="212" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="268" x2="340" y2="298" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="354" x2="340" y2="384" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect class="purple" x="210" y="40" width="260" height="56" rx="8"/>
<text class="th" x="340" y="63" text-anchor="middle">ClaimForm submits</text>
<text class="ts" x="340" y="81" text-anchor="middle">User fills form, clicks submit</text>
</g>

<g>
<rect class="teal" x="210" y="126" width="260" height="56" rx="8"/>
<text class="th" x="340" y="149" text-anchor="middle">POST /api/claims</text>
<text class="ts" x="340" y="167" text-anchor="middle">createClaim() sends request</text>
</g>

<g>
<rect class="coral" x="210" y="212" width="260" height="56" rx="8"/>
<text class="th" x="340" y="235" text-anchor="middle">onClaimCreated()</text>
<text class="ts" x="340" y="253" text-anchor="middle">Callback prop fires</text>
</g>

<g>
<rect class="teal" x="210" y="298" width="260" height="56" rx="8"/>
<text class="th" x="340" y="321" text-anchor="middle">App refetches</text>
<text class="ts" x="340" y="339" text-anchor="middle">loadClaims() calls getClaims()</text>
</g>

<g>
<rect class="purple" x="210" y="384" width="260" height="56" rx="8"/>
<text class="th" x="340" y="407" text-anchor="middle">ClaimsList re-renders</text>
<text class="ts" x="340" y="425" text-anchor="middle">New claim now visible</text>
</g>
</svg>
